  <style>

:220px;border-radius:32%;transform:rotate(-18deg);background:linear-gradient(135deg,#45eff8aa,#7656f8aa);filter:drop-shadow(0 0 45px #57d6fa75)}.orb:after{content:"</>";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:58px;font-weight:900;transform:rotate(18deg)}.toolbar{display:flex;gap:12px;align-items:center}.search{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;background:#121b32;padding:0 16px}.search span{color:var(--cyan);font-size:23px}.search input{width:100%;height:52px;color:var(--text);background:transparent;border:0;outline:0}.search input::placeholder{color:#7384a7}.clear{background:none;border:0;color:var(--muted);font-size:20px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 26px}.chip{border:1px solid #354666;background:#101a33;color:#b9c7e3;padding:9px 15px;border-radius:999px;transition:.2s}.chip:hover,.chip.active{border-color:var(--cyan);background:#42dcea20;color:var(--cyan)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:12px 0 16px}.section-head h2{margin:0;font-size:23px}.section-head small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(160deg,#152341,#10182c);border-radius:22px;padding:0;color:var(--text);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-6px);border-color:#66ddff99;box-shadow:0 20px 40px #02051399}.art{height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 65% 20%,var(--accent),transparent 58%),linear-gradient(135deg,#263b6c,#101b36)}.art:before{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff30;border-radius:30px;transform:rotate(25deg);box-shadow:0 0 0 25px #ffffff08,0 0 0 50px #ffffff06}.art .symbol{font-size:54px;filter:drop-shadow(0 8px 20px #0008);z-index:1}.body{padding:18px}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{color:#9decf7;background:#2be1f11b;border:1px solid #45dcec36;border-radius:6px;font-size:11px;padding:4px 7px}.tag.diff{margin-left:auto;color:#d1bcff;background:#8e70ff22;border-color:#8e70ff4a}.card h3{font-size:18px;margin:15px 0 7px}.card p{font-size:13px;line-height:1.65;color:var(--muted);min-height:43px;margin:0 0 16px}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff15;padding-top:13px;color:#9fb2d4;font-size:12px}.arrow{color:var(--cyan);font-size:19px}.empty{padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:5px;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));background:#0b1425ed;border-top:1px solid #ffffff1c;backdrop-filter:blur(18px)}.nav button{min-width:112px;border:0;background:transparent;color:#91a2c3;padding:8px 12px;border-radius:12px}.nav button.active{color:var(--cyan);background:#42dcea16}.nav span{display:block;font-size:20px}.page{display:none}.page.active{display:block}.info{max-width:750px;margin:34px auto;padding:32px;background:linear-gradient(150deg,#152440,#111a30);border:1px solid var(--line);border-radius:24px}.info h2{font-size:29px;margin-top:0}.info p,.info li{color:#bbcae4;line-height:1.85}.info ul{padding-left:20px}.contact-id{padding:16px;border:1px dashed #6bd9e9;border-radius:12px;color:var(--cyan);background:#36cce012;margin:20px 0;word-break:break-all}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#030815ce;padding:16px;backdrop-filter:blur(8px)}.overlay.open{display:flex}.modal{position:relative;max-width:620px;width:100%;max-height:90vh;overflow:auto;background:#14213d;border:1px so <body>
  <div class="shell">
    <header class="top"><div class="brand">PROJECT<span style="color:#9d8bff">/</span><b>LAB</b></div><small>大学生全栈项目实训</small></header>
    <main id="projects" class="page active">
      
      <section id="catalog"><div class="toolbar"><label class="search"><span>⌕</span><input id="query" type="search" placeholder="搜索项目名称或技术栈" aria-label="搜索项目"/><button class="clear" id="clear" aria-label="清空搜索">×</button></label></div><div class="filters" id="filters"></div><div class="section-head"><h2>精选项目</h2><small id="count"></small></div><div class="grid" id="grid"></div></section>
    </main>
    <main id="about" class="page"><section class="info"><div class="eyebrow">ABOUT THE CREATOR</div><h2>你好，我是项目创作者。</h2><p>这里展示我在全栈开发与项目实战中的作品。每个项目都围绕真实需求设计，涵盖需求分析、界面、功能实现与部署。</p><ul><li>方向：Web 全栈 / 微信小程序 / AI 应用</li><li>内容：项目目标、技术栈、核心功能与成果</li><li id="aboutContactLine">合作或交流：请在“联系我”页面查看方式</li></ul></section></main>
    <main id="contact" class="page"><section class="info"><div class="eyebrow">LET'S CONNECT</div><h2>想进一步了解项目？</h2><p>欢迎联系我，交流项目设计、技术实现或合作想法。</p><div class="contact-id" id="wechat">微信号：请替换为你的微信号</div><button class="primary" id="copy">复制微信号</button><p style="font-size:12px">这是原型占位内容。发布前请替换为你自己的联系方式。</p></section></main>
  </div>
  <nav class="nav" aria-label="底部导航"><button class="active" data-page="projects"><span>▦</span>项目</button><button data-page="about"><span>◉</span>关于我</button><button data-page="contact"><span>✉</span>联系我</button></nav>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modal"><button class="close" id="close" aria-label="关闭详情">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
  <script>
    const projects=[
      {id:1,title:'校园二手交易平台',category:'Java',stack:'Java · Spring Boot · Vue',level:'入门',icon:'↗',accent:'#50d9ef',description:'商品发布、搜索、沟通与订单管理，构建完整的校园闲置交易流程。',features:['商品发布与分类检索','用户登录与个人中心','订单管理与交易状态','后台管理和部署说明']},
      {id:2,title:'智能简历分析助手',category:'AI应用',stack:'Python · FastAPI · AI',level:'进阶',icon:'✧',accent:'#a283ff',description:'解析简历内容，结合岗位要求生成能力分析和优化建议。',features:['简历上传与结构化解析','岗位能力匹配','个性化优化建议','分析结果可视化']},
      {id:3,title:'校园活动报名小程序',category:'小程序',stack:'微信小程序 · 云开发',level:'入门',icon:'◎',accent:'#60e5bc',description:'活动展示、在线报名、签到与活动管理，覆盖完整参与流程。',features:['活动列表与详情','一键报名与取消','现场签到','组织者管理界面']},
      {id:4,title:'个人知识库系统',category:'Java',stack:'Java · Spring Boot · MySQL',level:'进阶',icon:'▤',accent:'#f8b570',description:'整理笔记、标签和搜索，让学习资料沉淀为自己的知识体系。',features:['笔记编辑与分类','标签系统','全文搜索','个人数据管理']},
      {id:5,title:'学习任务看板',category:'Python',stack:'Python · Flask · SQLite',level:'入门',icon:'▥',accent:'#83c7ff',description:'拆解目标、安排计划并跟踪进度，把学习过程变得可见。',features:['任务创建与状态流转','周计划视图','进度统计','提醒设置']},
      {id:6,title:'AI 旅行计划助手',category:'AI应用',stack:'Python · AI · Vue',level:'进阶',icon:'✦',accent:'#fa95c7',description:'根据目的地、时间和偏好生成可编辑的个性化行程。',features:['旅行偏好输入','行程自动生成','路线与预算规划','计划保存与修改']}
    ];
    const categories=['全部','Java','Python','小程序','AI应用'];let selected='全部';const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const q=$('#query').value.trim().toLowerCase();$('#filters').innerHTML=categories.map(c=>`<button class="chip ${selected===c?'active':''}" data-filter="${c}">${c}</button>`).join('');const list=projects.filter(p=>(selected==='全部'||p.category===selected)&&`${p.title} ${p.stack} ${p.description}`.toLowerCase().includes(q));$('#count').textContent=`共 ${list.length} 个项目`;$('#grid').innerHTML=list.length?list.map(p=>`<button class="card" data-id="${p.id}" aria-label="查看${p.title}详情"><div class="art" style="--accent:${p.accent}"><span class="symbol">${p.icon}</span></div><div class="body"><div class="tagrow"><span class="tag">${escapeHTML(p.stack)}</span><span class="tag diff">${p.level}</span></div><h3>${p.title}</h3><p>${p.description}</p><div class="card-foot"><span>查看项目详情</span><span class="arrow">↗</span></div></div></button>`).join(''):'<div class="empty">没有找到相关项目，换个关键词试试。</div>'}
    function showPage(id){if(id==='contact'&&document.body.classList.contains('contact-hidden'))id='projects';document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
    function applyContactSetting(){let saved={};try{saved=JSON.parse(localStorage.getItem('projectlab-admin-v1'))?.contact||{}}catch{}const param=new URLSearchParams(location.search).get('showContact');const visible=param==='0'?false:param==='1'?true:saved.show!==false;document.body.classList.toggle('contact-hidden',!visible);if(!visible&&$('#contact').classList.contains('active'))showPage('projects');if(visible&&saved.wechat){$('#wechat').textContent='微信号：'+saved.wechat;$('#copy').dataset.value=saved.wechat}if(visible&&saved.title)$('#contact h2').textContent=saved.title;if(visible&&saved.text)$('#contact .info > p').textContent=saved.text}
    const media={};
    function demoImage(p,n){const title=escapeHTML(p.title),word=escapeHTML(typeof n==='string'?n:(n===1?'项目首页示意图':'功能页面示意图'));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#e9f5ff"/><stop offset="1" stop-color="#edf0ff"/></linearGradient></defs><rect width="960" height="540" fill="url(#g)"/><rect x="70" y="52" width="820" height="435" rx="24" fill="white" stroke="#d9e7f7" stroke-width="3"/><rect x="70" y="52" width="820" height="56" rx="24" fill="#dcecff"/><circle cx="105" cy="80" r="8" fill="#79b7ef"/><circle cx="130" cy="80" r="8" fill="#a1d2f3"/><circle cx="155" cy="80" r="8" fill="#c4e4f8"/><rect x="102" y="142" width="180" height="310" rx="12" fill="#f1f7ff"/><rect x="312" y="142" width="540" height="55" rx="12" fill="#edf5ff"/><rect x="312" y="220" width="250" height="196" rx="14" fill="#d6ebff"/><rect x="584" y="220" width="268" height="86" rx="14" fill="#eef3ff"/><rect x="584" y="328" width="268" height="88" rx="14" fill="#e8f8f3"/><text x="330" y="180" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="bold" fill="#326bb2">${title}</text><text x="480" y="463" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" fill="#7b97ba">${word} · 请替换为真实项目截图</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
    function getMedia(p){return media[p.id]||(media[p.id]={images:[demoImage(p,1),demoImage(p,2)],video:null})}
    function renderGallery(id,index=0){const p=projects.find(x=>x.id===Number(id)),m=getMedia(p);$('#galleryMain').src=m.images[index];$('#galleryThumbs').innerHTML=m.images.map((src,i)=>`<button class="thumb ${i===index?'active':''}" data-image="${i}" aria-label="查看第${i+1}张图片"><img src="${src}" alt="${p.title}第${i+1}张展示图"></button>`).join('')}
    function openProject(id){const p=projects.find(x=>x.id===Number(id));if(!p)return;const m=getMedia(p);$('#modalContent').innerHTML=`<div class="eyebrow">PROJECT / ${String(p.id).padStart(2,'0')}</div><h2 id="modalTitle">${p.title}</h2><div class="tagrow"><span class="tag">${escapeHTML(p.stack)}</span><span class="tag">${p.level}</span></div><section class="detail-section"><h3>项目展示图片</h3><img class="gallery-main" id="galleryMain" alt="${p.title}展示图片"><div class="gallery-thumbs" id="galleryThumbs"></div><p class="media-note">当前为示意图。选择你的真实截图后可立即预览；刷新页面后需重新选择。</p><div class="media-actions"><label>＋ 添加项目图片<input id="imageUpload" type="file" accept="image/*" multiple></label></div></section><section class="detail-section"><h3>演示视频</h3><div class="video-box" id="videoBox">${m.video?`<video controls playsinline src="${m.video}"></video>`:'<div><span>▶</span>添加项目演示视频后可在这里播放</div>'}</div><p class="media-note">建议使用 30～90 秒的 MP4，展示主要使用流程。</p><div class="media-actions"><label>＋ 选择演示视频<input id="videoUpload" type="file" accept="video/*"></label></div></section><section class="detail-section"><h3>项目简介</h3><p class="detail-lead">${p.description}</p></section><section class="detail-section"><h3>主要技术</h3><div class="tech-list">${p.stack.split(' · ').map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div></section><section class="detail-section"><h3>核心功能</h3><ul class="detail-feature">${p.features.map(f=>`<li>✓ ${f}</li>`).join('')}</ul></section>`;renderGallery(id);$('#overlay').dataset.projectId=id;$('#overlay').classList.add('open');document.body.style.overflow='hidden'}
    const featureDescriptions={
      '商品发布与分类检索':'用户可以填写商品名称、价格、成色和描述，上传多张图片后发布商品。浏览者可按分类筛选，并通过关键词快速查找感兴趣的物品。',
      '用户登录与个人中心':'用户登录后可以管理个人资料、查看自己发布的商品，并集中处理收藏、沟通记录和交易相关信息。',
      '订单管理与交易状态':'买卖双方可以查看订单状态，跟踪从下单、确认到完成的整个交易过程。',
      '后台管理和部署说明':'管理员可以维护商品分类与内容；项目还提供部署步骤，便于在服务器上运行和演示。',
      '简历上传与结构化解析':'上传 PDF 或文档简历后，系统提取教育背景、项目经历和技能信息，并整理成统一的分析字段。',
      '岗位能力匹配':'输入目标岗位要求，系统对照简历中的技能与经历，展示符合项、缺失项和匹配依据。',
      '个性化优化建议':'根据目标岗位和现有简历内容，生成更有针对性的表达建议，用户可逐条查看和修改。',
      '分析结果可视化':'将能力覆盖、关键词命中和改进方向集中呈现，帮助用户快速定位简历中的重点问题。',
      '活动列表与详情':'用户可以浏览活动时间、地点、名额和介绍，并按状态筛选可报名的活动。',
      '一键报名与取消':'在活动详情中提交报名信息，并可在规则允许时取消报名，报名状态会同步更新。',
      '现场签到':'活动现场通过签到入口确认参与状态，组织者可以查看已签到与未签到名单。',
      '组织者管理界面':'组织者可以创建活动、管理名额、查看报名名单并统计参与情况。',
      '笔记编辑与分类':'创建和编辑学习笔记，设置分类并保存内容，便于后续整理和复习。',
      '标签系统':'给笔记添加多个标签，通过标签快速聚合同一主题的内容。',
      '全文搜索':'输入关键词检索笔记标题和正文，在结果中快速打开匹配内容。',
      '个人数据管理':'集中查看、修改和删除自己的笔记与分类，维护知识库结构。',
      '任务创建与状态流转':'创建任务并设置截止时间，按照待办、进行中和已完成更新执行状态。',
      '周计划视图':'按一周时间展示任务安排，方便检查每日工作量和计划冲突。',
      '进度统计':'汇总任务完成数量与周期进度，帮助用户了解目标推进情况。',
      '提醒设置':'给重要任务设置提醒时间，在临近截止时提示用户处理。',
      '旅行偏好输入':'填写目的地、出行日期、预算和兴趣偏好，作为生成行程的基础。',
      '行程自动生成':'根据输入的条件生成按天排列的行程草案，包括推荐地点与时间安排。',
      '路线与预算规划':'将景点顺序与预算估算集中展示，便于调整路线和控制花费。',
      '计划保存与修改':'保存生成的旅行计划，并允许用户修改活动顺序、备注和预算。'
    };
    function activateFeatureLinks(){document.querySelectorAll('.detail-feature li').forEach((li,i)=>{const title=li.textContent.replace(/^✓\s*/, '');li.innerHTML=`<button class="feature-link" data-feature="${i}"><span>✓ ${escapeHTML(title)}</span><b>›</b></button>`})}
    function openFeature(index){const p=projects.find(x=>x.id===Number($('#overlay').dataset.projectId));if(!p)return;const name=p.features[index],description=featureDescriptions[name]||`此功能是“${p.title}”的一部分，围绕${name}完成从操作入口、信息处理到结果反馈的完整流程。正式展示时可补充真实业务规则、页面细节和实现效果。`;const shot1=demoImage(p,name+'入口示意图'),shot2=demoImage(p,name+'操作结果示意图');$('#modalContent').innerHTML=`<div class="feature-detail"><button class="feature-back" id="featureBack">← 返回${p.title}</button><div class="eyebrow">FEATURE / ${String(index+1).padStart(2,'0')}</div><h2 id="modalTitle">${name}</h2><p>${description}</p><section class="detail-section"><h3>功能页面截图</h3><figure class="feature-shot" style="margin:0"><img class="feature-image" src="${shot1}" alt="${name}入口示意图"><figcaption>页面一：功能入口与主要操作</figcaption></figure><figure class="feature-shot" style="margin:16px 0 0"><img class="feature-image" src="${shot2}" alt="${name}操作结果示意图"><figcaption>页面二：操作结果与信息反馈</figcaption></figure><p class="media-note">当前为示意截图。可选择真实功能截图替换预览。</p><div class="media-actions"><label>＋ 选择功能截图<input id="featureUpload" type="file" accept="image/*" multiple></label></div></section><section class="detail-section"><h3>功能流程</h3><ol class="feature-flow"><li>进入“${name}”功能页面</li><li>填写或选择相关信息</li><li>提交操作并查看结果反馈</li></ol></section></div>`;$('#modal').scrollTop=0}
    function closeModal(){$('#overlay').classList.remove('open');document.body.style.overflow=''}
    document.addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){selected=filter.dataset.filter;render()}const card=e.target.closest('[data-id]');if(card){openProject(card.dataset.id);activateFeatureLinks()}const image=e.target.closest('[data-image]');if(image)renderGallery($('#overlay').dataset.projectId,Number(image.dataset.image));const feature=e.target.closest('[data-feature]');if(feature)openFeature(Number(feature.dataset.feature));if(e.target.closest('#featureBack')){openProject($('#overlay').dataset.projectId);activateFeatureLinks();$('#modal').scrollTop=$('.detail-feature').offsetTop-80}const page=e.target.closest('[data-page]');if(page){closeModal();showPage(page.dataset.page)}});
    document.addEventListener('change',e=>{const id=Number($('#overlay').dataset.projectId),p=projects.find(x=>x.id===id);if(!p)return;if(e.target.id==='imageUpload'){const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(files.length){getMedia(p).images=files.map(f=>URL.createObjectURL(f));renderGallery(id);notify(`已添加 ${files.length} 张图片`)}}if(e.target.id==='videoUpload'){const file=e.target.files[0];if(file&&file.type.startsWith('video/')){const m=getMedia(p);if(m.video)URL.revokeObjectURL(m.video);m.video=URL.createObjectURL(file);$('#videoBox').innerHTML=`<video controls playsinline src="${m.video}"></video>`;notify('视频已添加，可点击播放')}}if(e.target.id==='featureUpload'){const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));document.querySelectorAll('.feature-image').forEach((img,i)=>{if(files[i])img.src=URL.createObjectURL(files[i])});if(files.length)notify(`已替换 ${Math.min(files.length,2)} 张功能截图`)}});
    render();applyContactSetting();
    $('#query').addEventListener('input',render);$('#clear').onclick=()=>{$('#query').value='';render();$('#query').focus()};$('#close').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#copy').onclick=async()=>{const value=$('#copy').dataset.value||'请替换为你的微信号';try{await navigator.clipboard.writeText(value);notify('微信号已复制')}catch{notify('复制失败，请手动复制')}};function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
  </script>
